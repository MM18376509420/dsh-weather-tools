- insert:
    - id: weather-tools
      name: dsh-weather-tools

    - id: transcribe-tool
      name: dsh-weather-tools/transcribe-tool
      config:
        endpoint: !!js process.env.ASR_ENDPOINT
        model: !!js process.env.ASR_MODEL
        defaultLanguage: !!js process.env.ASR_LANGUAGE

    - id: video-labeler
      name: dsh-weather-tools/video-labeler
      config:
        baseURL: !!js process.env.OPENAI_BASE_URL
        apiKey: !!js process.env.OPENAI_API_KEY
        model: MiniCPM-V-4_5
        promptId: ly-at-video-tag-prompt
